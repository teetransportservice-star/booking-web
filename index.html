<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>จองคิวขนส่งสินค้า</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f6f8;--card:#fff;--text:#1b2430;--muted:#6b7684;--line:#dfe4ea;--brand:#06c755;--brandtxt:#fff;--sel:#e8f9ef}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151b;--card:#1a212a;--text:#eef2f6;--muted:#9aa5b1;--line:#2c3541;--brand:#06c755;--brandtxt:#06210f;--sel:#12301f}}
:root[data-theme="dark"]{--bg:#10151b;--card:#1a212a;--text:#eef2f6;--muted:#9aa5b1;--line:#2c3541;--brand:#06c755;--brandtxt:#06210f;--sel:#12301f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;font-size:15px}
.wrap{max-width:520px;margin:0 auto;padding:12px 14px 90px}
header{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 10px}
h1{font-size:18px;margin:0}
.who{font-size:12px;color:var(--muted)}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:9px;border-radius:9px;font:inherit;font-weight:600}
.tabs button.on{background:var(--brand);color:var(--brandtxt)}
.steps{display:flex;gap:6px;margin-bottom:12px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 10px}
.veh{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.v{border:2px solid var(--line);border-radius:12px;padding:10px;background:var(--card);color:var(--text);text-align:left;font:inherit;cursor:pointer}
.v.on{border-color:var(--brand);background:var(--sel)}
.v .e{font-size:28px}.v b{display:block;margin-top:2px}.v small{color:var(--muted);display:block;line-height:1.35}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{padding:9px 0;text-align:center;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
.slot.on{background:var(--brand);color:var(--brandtxt);border-color:var(--brand);font-weight:700}
.slot:disabled{opacity:.35;text-decoration:line-through}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center}
.bar button{flex:1;max-width:250px;padding:13px;border-radius:12px;border:0;font:inherit;font-weight:700}
.p{background:var(--brand);color:var(--brandtxt)}.s{background:var(--bg);color:var(--text);border:1px solid var(--line)!important}
.p:disabled{opacity:.4}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.sum div:last-child{border:0}.sum span{color:var(--muted)}.sum b{text-align:right}
.err{color:#e5484d;font-size:13px;margin-top:8px;min-height:16px}
.bk{display:flex;justify-content:space-between;gap:8px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--sel);color:var(--brand);font-weight:700;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:30px 0}
#qr img{max-width:100%;height:auto;border-radius:8px;background:#fff;padding:6px}
.ok{text-align:center;padding:10px 0}.ok .big{font-size:48px}
.link{background:none;border:0;color:#e5484d;font:inherit;font-size:13px;padding:6px 0}
</style>
<!-- PREMIUM-UI:START (ลบทั้งบล็อกนี้จนถึงคอมเมนต์ปิดท้าย เพื่อกลับเป็นแบบเดิม) -->
<meta name="theme-color" content="#0B1B33">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F3EE;--card:#FFFFFF;--text:#0F172A;--muted:#667085;--line:#E8E3D8;--brand:#B08A3E;--brandtxt:#0B1B33;--bt:#0B1B33;--sel:#FBF5E6;--navy:#0B1B33;--navy2:#17305A;--gold1:#D9B86C;--gold2:#B08A3E;--shadow:0 1px 2px rgba(11,27,51,.05),0 10px 30px rgba(11,27,51,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A101C;--card:#121B2D;--text:#EEF2F7;--muted:#97A3B6;--line:#233048;--brand:#D2AE63;--brandtxt:#0B1B33;--bt:#0B1B33;--sel:#2A2413;--shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.35)}:root:not([data-theme="light"]) .tag{color:#E6C98A}}
:root[data-theme="dark"]{--bg:#0A101C;--card:#121B2D;--text:#EEF2F7;--muted:#97A3B6;--line:#233048;--brand:#D2AE63;--brandtxt:#0B1B33;--bt:#0B1B33;--sel:#2A2413;--shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.35)}
:root[data-theme="dark"] .tag{color:#E6C98A}
body{line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{padding-top:0;padding-bottom:100px}
header{position:relative;background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;margin:0 -14px 16px;padding:22px 20px 36px;border-radius:0 0 28px 28px;box-shadow:0 12px 32px rgba(11,27,51,.28)}
header::after{content:"";position:absolute;left:20px;bottom:0;width:56px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--gold1),var(--gold2))}
header h1{font-size:19px;font-weight:600;color:#fff}
header .who{color:rgba(255,255,255,.72);font-size:12px}
.tabs{position:relative;margin-top:-30px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:4px;box-shadow:var(--shadow)}
.tabs button{border-radius:14px;font-weight:600;color:var(--muted);transition:.2s}
.tabs button.on{background:linear-gradient(135deg,var(--gold1),var(--gold2));color:var(--navy);box-shadow:0 6px 14px rgba(176,138,62,.3)}
.steps i{height:5px;border-radius:5px;background:var(--line);transition:.3s}
.steps i.on{background:linear-gradient(90deg,var(--gold1),var(--gold2))}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);animation:up .3s ease both}
h2{font-size:16px;font-weight:600;margin:0 0 12px}
label{font-size:12.5px;font-weight:500;color:var(--muted);margin:14px 0 6px;letter-spacing:.2px}
input,select,textarea{background:var(--bg);border:1.5px solid transparent;border-radius:14px;padding:14px 15px;font-size:15px;transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;background:var(--card);border-color:var(--gold2);box-shadow:0 0 0 4px rgba(176,138,62,.18)}
input[type=checkbox]{padding:0;width:18px;height:18px;accent-color:var(--brand)}
.v{position:relative;border:1.5px solid var(--line);border-radius:18px;padding:12px;background:var(--card);box-shadow:var(--shadow);transition:.15s}
.v:active{transform:scale(.98)}
.v .e{display:grid;place-items:center;width:64px;height:46px;border-radius:14px;background:linear-gradient(145deg,var(--navy),var(--navy2));color:var(--gold1);margin-bottom:10px;box-shadow:0 8px 16px rgba(11,27,51,.22)}
.v .e svg{width:50px;height:auto;display:block}
.v b{font-size:14px;font-weight:600}
.v small{font-size:11.5px;line-height:1.45}
.v.on{border-color:var(--gold2);background:var(--sel);box-shadow:0 0 0 3px rgba(176,138,62,.18),var(--shadow)}
.v.on::after{content:"✓";position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--gold1),var(--gold2));color:var(--navy);display:grid;place-items:center;font-size:12px;font-weight:800}
.bar{background:var(--card);background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(11,27,51,.07);gap:12px}
.bar button,.btn{border-radius:16px;padding:15px;font-weight:700;transition:transform .12s,box-shadow .2s,opacity .2s}
.bar button:active,.btn:active{transform:scale(.97)}
.p{background:linear-gradient(135deg,var(--gold1),var(--gold2));color:var(--navy);box-shadow:0 8px 20px rgba(176,138,62,.35)}
.p:disabled{box-shadow:none;opacity:.45}
.s{background:var(--card);color:var(--text);border:1.5px solid var(--line)!important}
.slot{border-radius:14px;padding:12px 0;background:var(--bg);border:1.5px solid transparent;font-weight:500;transition:.15s}
.slot.on{background:linear-gradient(135deg,var(--gold1),var(--gold2));color:var(--navy);box-shadow:0 6px 14px rgba(176,138,62,.3)}
.tag{background:var(--sel);color:#7A5714;border:1px solid rgba(176,138,62,.35);padding:3px 10px;font-weight:600}
.sum div{padding:10px 0}
.sum b{font-variant-numeric:tabular-nums;font-weight:600}
.empty{padding:44px 0}
.err{color:#D14343}
.link{color:#D14343;font-weight:500}
.ok .big{font-size:60px;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<!-- PREMIUM-UI:END -->
</head>
<body>
<div class="wrap">
  <header><h1>🚚 จองคิวขนส่งสินค้า</h1><div class="who" id="who">โหมดทดลอง</div></header>
  <div class="tabs"><button id="t1" class="on" onclick="tab(1)">จองคิวใหม่</button><button id="t2" onclick="tab(2)">คิวของฉัน</button><button id="t3" style="display:none" onclick="tab(3)">แอดมิน</button></div>
  <div id="app"></div>
</div>
<div class="bar" id="bar"></div>

<script>
// ====== ตั้งค่า ======
var LIFF_ID = "2012136960-dNGNm2uj"; // ใส่ LIFF ID จาก LINE Developers Console
var API_URL = "https://booking-api.qtransport.workers.dev"; // URL ของ backend (server.js) เช่น https://api.example.com ; ว่าง = โหมดทดลองในเครื่อง
var ADMIN_PIN = "1234"; // ใช้เฉพาะโหมดทดลอง (เมื่อไม่มี API_URL) — เปิดหน้าแอดมินที่ #admin
var VEHICLES = [
  {id:"pickup4",e:"🛻",n:"รถกระบะ 4 ล้อ",c:"บรรทุกถึง 1 ตัน",d:"ของชิ้นเล็ก/กลาง ส่งในเมือง",base:600,km:12},
  {id:"truck6",e:"🚚",n:"รถ 6 ล้อ",c:"บรรทุกถึง 6 ตัน",d:"พาเลท เฟอร์นิเจอร์ สินค้าทั่วไป",base:1800,km:22},
  {id:"truck10",e:"🚛",n:"รถ 10 ล้อ",c:"บรรทุกถึง 15 ตัน",d:"สินค้าปริมาณมาก ข้ามจังหวัด",base:3500,km:35},
  {id:"trailer",e:"🚜",n:"รถพ่วง/เทรลเลอร์",c:"บรรทุกถึง 30 ตัน",d:"ตู้คอนเทนเนอร์ เครื่องจักรใหญ่",base:6000,km:55},
  {id:"cold",e:"❄️",n:"รถห้องเย็น",c:"บรรทุกถึง 3 ตัน",d:"อาหารสด ยา สินค้าควบคุมอุณหภูมิ",base:2800,km:30},
  {id:"van",e:"📦",n:"กระบะคอกหรือตู้ทึบ",c:"บรรทุกถึง 3 ตัน",d:"สินค้าทั่วไป พัสดุ ของที่ต้องกันฝน",base:1200,km:18}
];
var SLOTS=["08:00","09:00","10:00","11:00","13:00","14:00","15:00","16:00","17:00"];
var CARGO=["สินค้าทั่วไป","อาหาร/เครื่องดื่ม","วัสดุก่อสร้าง","เฟอร์นิเจอร์","เครื่องจักร/อุปกรณ์","อิเล็กทรอนิกส์","อื่น ๆ"];

// ====== สถานะ ======
var S={step:1,tab:1,v:null,f:{name:"",phone:"",from:"",to:"",cargo:CARGO[0],weight:"",km:"",date:"",time:"",note:""},err:"",done:null};
var profile=null,liffOk=false;
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function load(){try{return JSON.parse(localStorage.getItem("bookings")||"[]")}catch(e){return []}}
function save(a){try{localStorage.setItem("bookings",JSON.stringify(a))}catch(e){}}
function veh(id){return VEHICLES.filter(function(x){return x.id===id})[0]}
function est(){var v=veh(S.v);if(!v)return 0;return v.base+v.km*(parseFloat(S.f.km)||0)}
function baht(n){return "฿"+Math.round(n).toLocaleString("th-TH")}
function today(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}

function fmtDate(d){try{return new Date(d+"T00:00").toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"numeric"})}catch(e){return d}}

// ====== LIFF ======
function initLiff(){
  if(!LIFF_ID||typeof liff==="undefined")return;
  liff.init({liffId:LIFF_ID}).then(function(){
    liffOk=true;
    if(!liff.isLoggedIn()){liff.login();return}
    return liff.getProfile().then(function(p){
      profile=p;S.f.name=S.f.name||p.displayName;
      document.getElementById("who").textContent="👤 "+p.displayName;render();var pq=new URLSearchParams(location.search).get("pay");if(pq&&API_URL)payOpen(pq);
    });
  }).catch(function(e){console.warn("LIFF",e)});
}
(function(){
  if(!LIFF_ID||location.hash==="#admin")return;
  try{var s=document.createElement("script");s.src="https://static.line-scdn.net/liff/edge/2/sdk.js";s.onload=initLiff;document.head.appendChild(s)}catch(e){}
})();

// ====== ส่วนแสดงผล ======
function tab(n){S.tab=n;S.done=null;["t1","t2","t3"].forEach(function(id,i){document.getElementById(id).className=(i+1)==n?"on":""});
  if(n==2&&API_URL&&profile){fetch(API_URL+"/my",{headers:authH()}).then(function(r){return r.json()}).then(function(d){save(d);render()}).catch(function(){})}
  if(n==3&&AK){adminLoad();return}
  render()}
function bar(html){document.getElementById("bar").innerHTML=html}
function render(){
  var a=document.getElementById("app");
  if(S.tab===3){renderAdmin();return}
  if(S.tab===2){renderList(a);return}
  if(S.done){renderDone(a);return}
  var steps='<div class="steps">'+[1,2,3].map(function(i){return '<i class="'+(i<=S.step?"on":"")+'"></i>'}).join("")+'</div>';
  if(S.step===1){
    a.innerHTML=steps+'<div class="card"><h2>1. เลือกรูปแบบรถ</h2><div class="veh">'+VEHICLES.map(function(v){
      return '<button class="v '+(S.v===v.id?"on":"")+'" onclick="pickV(\''+v.id+'\')"><span class="e">'+ico(v.id)+'</span><b>'+v.n+'</b><small>'+v.c+'<br>'+v.d+'</small></button>'}).join("")+'</div></div>';
    bar('<button class="p" '+(S.v?"":"disabled")+' onclick="go(2)">ถัดไป</button>');
  }else if(S.step===2){
    var f=S.f;
    a.innerHTML=steps+'<div class="card"><h2>2. รายละเอียดการขนส่ง</h2>'+
    '<label>ชื่อผู้จอง</label><input id="name" value="'+esc(f.name)+'" placeholder="ชื่อ-นามสกุล">'+
    '<label>เบอร์โทร</label><input id="phone" type="tel" inputmode="tel" value="'+esc(f.phone)+'" placeholder="08x-xxx-xxxx">'+
    '<label>จุดรับสินค้า</label><input id="from" value="'+esc(f.from)+'" placeholder="ที่อยู่ / จังหวัด">'+
    '<label>จุดส่งสินค้า</label><input id="to" value="'+esc(f.to)+'" placeholder="ที่อยู่ / จังหวัด">'+
    '<div class="row"><div><label>ประเภทสินค้า</label><select id="cargo">'+CARGO.map(function(c){return '<option'+(c===f.cargo?" selected":"")+'>'+c+'</option>'}).join("")+'</select></div>'+
    '<div><label>น้ำหนัก (กก.)</label><input id="weight" type="number" inputmode="numeric" min="1" value="'+esc(f.weight)+'"></div></div>'+
    '<label>ระยะทางโดยประมาณ (กม.)</label><input id="km" type="number" inputmode="numeric" min="1" value="'+esc(f.km)+'">'+
    '<label>หมายเหตุ</label><textarea id="note" rows="2" placeholder="เช่น ต้องมีคนช่วยยก, ขึ้นตึกชั้น 3">'+esc(f.note)+'</textarea></div>'+
    '<div class="card"><h2>เลือกวันและเวลารับสินค้า</h2><input id="date" type="date" min="'+today()+'" value="'+esc(f.date)+'" onchange="saveF();render()">'+
    '<label>รอบเวลา</label><div class="slots">'+SLOTS.map(function(t){
      var off=false;
      return '<button class="slot '+(f.time===t?"on":"")+'" '+(off?"disabled":"")+' onclick="pickT(\''+t+'\')">'+t+'</button>'}).join("")+'</div>'+
    '<div class="err" id="err">'+esc(S.err)+'</div></div>';
    bar('<button class="s" onclick="saveF();go(1)">ย้อนกลับ</button><button class="p" onclick="next2()">ตรวจสอบ</button>');
  }else{
    var v=veh(S.v),f=S.f;
    a.innerHTML=steps+'<div class="card sum"><h2>3. ตรวจสอบและยืนยัน</h2>'+
    row("รถ",v.e+" "+v.n)+row("ผู้จอง",f.name)+row("โทร",f.phone)+row("รับสินค้า",f.from)+row("ส่งสินค้า",f.to)+
    row("สินค้า",f.cargo+" · "+f.weight+" กก.")+row("ระยะทาง",f.km+" กม.")+row("นัดรับ",fmtDate(f.date)+" เวลา "+f.time+" น.")+(f.note?row("หมายเหตุ",f.note):"")+
    row("ราคาประเมิน",'<span style="color:var(--brand);font-size:18px">'+baht(est())+'</span>')+'</div>'+
    '<div class="who" style="text-align:center">* ราคานี้เป็นราคาประเมิน ทีมงานจะยืนยันราคาจริงอีกครั้ง</div>';
    bar('<button class="s" onclick="go(2)">แก้ไข</button><button class="p" onclick="confirmB()">ยืนยันจองคิว</button>');
  }
}
function row(k,v){return '<div><span>'+k+'</span><b>'+(k==="ราคาประเมิน"?v:esc(v))+'</b></div>'}
// ไอคอนรูปรถของแต่ละประเภท (สีตามธีม)
function ico(id){
  var C="currentColor",H="#0B1B33";
  var W=function(x,r){r=r||7;return '<circle cx="'+x+'" cy="48" r="'+r+'" fill="'+C+'"/><circle cx="'+x+'" cy="48" r="'+(r*.4)+'" fill="'+H+'"/>'};
  var cab=function(x,t){return '<path d="M'+x+' 46V'+t+'H'+(x+22)+'l8 9V46z" fill="'+C+'"/><path d="M'+(x+4.5)+' '+(t+4.5)+'H'+(x+18.5)+'l5 6.5H'+(x+4.5)+'z" fill="'+H+'"/>'};
  var box=function(x,y,w){return '<rect x="'+(x+2.5)+'" y="'+(y+2.5)+'" width="'+(w-5)+'" height="'+(42-y-2.5)+'" rx="3" fill="none" stroke="'+C+'" stroke-width="5"/>'};
  var base=function(x,w){return '<rect x="'+x+'" y="42" width="'+w+'" height="5" rx="2.5" fill="'+C+'"/>'};
  var b='';
  if(id==="pickup4")b=base(6,102)+'<path d="M11 28v14h44V28" fill="none" stroke="'+C+'" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>'+cab(62,22)+'<path d="M92 32h12l4 5v9H92z" fill="'+C+'"/>'+W(26)+W(96);
  else if(id==="van")b=base(4,102)+box(6,12,60)+cab(68,19)+W(24)+W(88);
  else if(id==="truck6")b=base(2,104)+box(4,9,66)+cab(72,16)+W(21,6.5)+W(33,6.5)+W(90);
  else if(id==="truck10")b=base(0,110)+box(2,8,74)+cab(78,15)+W(13,6)+W(26,6)+W(39,6)+W(98,6);
  else if(id==="trailer")b=base(0,116)+box(2,12,76)+'<path d="M24 20v18M40 20v18M56 20v18" stroke="'+C+'" stroke-width="3.5" stroke-linecap="round"/>'+cab(82,17)+W(18,6)+W(30,6)+W(42,6)+W(92,6)+W(108,6);
  else if(id==="cold")b=base(2,104)+box(4,9,66)+'<g stroke="'+C+'" stroke-width="3.5" stroke-linecap="round"><path d="M37 17v20M28.3 22l17.4 10M28.3 32l17.4-10"/></g>'+cab(72,16)+W(21,6.5)+W(33,6.5)+W(90);
  else b=base(6,100)+box(6,14,60)+cab(68,20)+W(24)+W(88);
  return '<svg viewBox="0 4 116 54" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="รถ">'+b+'</svg>';
}
function pickV(id){S.v=id;render()}
function pickT(t){saveF();S.f.time=t;render()}
function go(n){S.step=n;S.err="";render();window.scrollTo(0,0)}
function saveF(){
  ["name","phone","from","to","cargo","weight","km","date","note"].forEach(function(k){var el=document.getElementById(k);if(el)S.f[k]=el.value.trim()})
}
function next2(){
  saveF();var f=S.f,m="";
  if(!f.name)m="กรุณากรอกชื่อ";else if(!/^0\d{8,9}$/.test(f.phone.replace(/[-\s]/g,"")))m="เบอร์โทรไม่ถูกต้อง";
  else if(!f.from||!f.to)m="กรุณากรอกจุดรับและจุดส่งสินค้า";
  else if(!(+f.weight>0))m="กรุณาระบุน้ำหนักสินค้า";else if(!(+f.km>0))m="กรุณาระบุระยะทางโดยประมาณ";
  else if(!f.date)m="กรุณาเลือกวันที่";else if(!f.time)m="กรุณาเลือกรอบเวลา";
  if(m){S.err=m;render();return}
  go(3)
}
function confirmB(){
  var v=veh(S.v),f=S.f;
  
  var b={id:"BK"+Date.now().toString().slice(-6),vehicle:v.n,emoji:v.e,name:f.name,phone:f.phone,from:f.from,to:f.to,cargo:f.cargo,weight:f.weight,km:f.km,date:f.date,time:f.time,note:f.note,price:est(),status:"รอยืนยัน",userId:profile?profile.userId:null};
  var all=load();all.unshift(b);save(all);
  if(API_URL){fetch(API_URL+"/bookings",{method:"POST",headers:authH(),body:JSON.stringify(b)}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(sb){var l=load();l.forEach(function(x){if(x.id===b.id)x.id=sb.id});save(l);b.id=sb.id;if(S.done===b)render()}).catch(function(){alert("ส่งคำขอจองไม่สำเร็จ กรุณาเปิดผ่านแอป LINE แล้วลองใหม่");save(load().filter(function(x){return x.id!==b.id}));S.done=null;go(2)})}
  S.done=b;
  if(!API_URL&&liffOk&&liff.isInThirdPartyApp&&liff.isApiAvailable&&liff.isApiAvailable("sendMessages")){
    var t="✅ จองคิวขนส่งสำเร็จ\nรหัส: "+b.id+"\nรถ: "+b.vehicle+"\nรับ: "+b.from+"\nส่ง: "+b.to+"\nนัด: "+fmtDate(b.date)+" "+b.time+" น.\nประเมิน: "+baht(b.price);
    try{liff.sendMessages([{type:"text",text:t}]).catch(function(){})}catch(e){}
  }
  render();window.scrollTo(0,0)
}
function renderDone(a){
  var b=S.done;
  a.innerHTML='<div class="card ok"><div class="big">✅</div><h2>จองคิวเรียบร้อย</h2><p>รหัสการจอง <b>'+esc(b.id)+'</b></p>'+
  '<p class="who">'+esc(b.emoji+" "+b.vehicle)+'<br>'+esc(fmtDate(b.date))+' เวลา '+esc(b.time)+' น.<br>ประเมิน '+baht(b.price)+'</p>'+
  '<p class="who">ทีมงานจะติดต่อกลับเพื่อยืนยันราคาและรายละเอียด</p></div>';
  bar('<button class="s" onclick="tab(2)">ดูคิวของฉัน</button><button class="p" onclick="reset()">จองเพิ่ม</button>');
}
function reset(){S.step=1;S.v=null;S.done=null;S.f.from=S.f.to=S.f.weight=S.f.km=S.f.date=S.f.time=S.f.note="";render()}
function renderList(a){
  var l=load();
  a.innerHTML=l.length?l.map(function(b){
    return '<div class="card"><div class="bk"><b>'+esc(b.emoji+" "+b.vehicle)+'</b><span class="tag">'+esc(b.status)+'</span></div>'+
    '<div class="who" style="margin-top:6px;line-height:1.6">รหัส '+esc(b.id)+'<br>'+esc(b.from)+' → '+esc(b.to)+'<br>'+esc(fmtDate(b.date))+' เวลา '+esc(b.time)+' น. · '+baht(b.price)+'</div>'+
    payBtn(b)+(b.status==="รอยืนยัน"?'<button class="link" onclick="cancelB(\''+b.id+'\')">ยกเลิกคิว</button>':'')+'</div>'}).join(""):
    '<div class="empty">ยังไม่มีรายการจอง</div>';
  bar('<button class="p" onclick="tab(1);reset()">+ จองคิวใหม่</button>');
}
function cancelB(id){
  if(!confirm("ยืนยันการยกเลิกคิว "+id+" ?"))return;
  var l=load();l.forEach(function(b){if(b.id===id)b.status="ยกเลิก"});save(l);
  if(API_URL){fetch(API_URL+"/bookings/"+id+"/cancel",{method:"POST",headers:authH()}).catch(function(){})}
  render()
}
// ส่ง LIFF access token ให้ backend ตรวจสอบตัวตนกับ LINE (backend ไม่เชื่อ userId ที่ client ส่งมาเอง)
function authH(){var h={"Content-Type":"application/json"};try{if(liffOk)h.Authorization="Bearer "+liff.getAccessToken()}catch(e){}return h}
// ====== ชำระเงิน (พร้อมเพย์ QR) ใช้ได้เมื่อตั้ง API_URL แล้วเท่านั้น ======
function pf(m,p,b){return fetch(API_URL+p,{method:m,headers:authH(),body:b?JSON.stringify(b):undefined}).then(function(r){return r.json().then(function(j){if(!r.ok)throw j;return j})})}
function payBtn(b){
  if(!API_URL||!b.finalPrice||b.status==="ยกเลิก"||b.status==="ปฏิเสธ")return "";
  var t=b.payStatus==="ยืนยันแล้ว"?"✅ ชำระเงินแล้ว":b.payStatus==="รอตรวจสอบ"?"⏳ รอตรวจสอบการโอน":"💳 ชำระเงิน "+baht(b.finalPrice);
  return '<button class="slot" style="width:auto;margin-top:8px;padding:8px 14px" onclick="payOpen(\''+esc(b.id)+'\')">'+t+'</button>';
}
function payOpen(id){
  S.tab=2;document.getElementById("t1").className="";document.getElementById("t2").className="on";
  pf("GET","/pay/"+id).then(function(p){payView(id,p)}).catch(function(x){alert((x&&x.error)||"โหลดข้อมูลชำระเงินไม่สำเร็จ กรุณาเปิดผ่านแอป LINE")});
}
function payView(id,p){
  var h='<div class="card"><h2>💳 ชำระเงิน คิว '+esc(id)+'</h2><div class="sum"><div><span>เส้นทาง</span><b>'+esc(p.from)+' → '+esc(p.to)+'</b></div><div><span>ยอดชำระ</span><b style="color:var(--brand);font-size:20px">'+baht(p.amount)+'</b></div></div></div>',pay=false;
  if(p.status==="ยืนยันแล้ว")h+='<div class="card ok"><div class="big">✅</div><h2>ชำระเงินเรียบร้อย</h2><p class="who">ขอบคุณที่ใช้บริการ</p></div>';
  else if(p.status==="รอตรวจสอบ")h+='<div class="card ok"><div class="big">⏳</div><h2>รอแอดมินตรวจสอบการโอน</h2><p class="who">เมื่อตรวจสอบแล้วจะแจ้งผลทาง LINE</p></div>';
  else{pay=true;
    h+='<div class="card" style="text-align:center">'+(p.status==="ปฏิเสธ"?'<p class="err">การแจ้งโอนครั้งก่อนไม่ผ่าน: '+esc(p.reason||"-")+'</p>':'')+'<h2>สแกน QR พร้อมเพย์</h2><div id="qr"></div><p class="who">'+esc(p.accountName||"")+'<br>โอนตามยอด '+baht(p.amount)+' · กดค้างที่ QR เพื่อบันทึกรูป แล้วเปิดแอปธนาคารเลือกสแกนจากรูป</p></div>'+
    '<div class="card"><h2>แจ้งการโอน</h2><label>วัน-เวลาที่โอน</label><input id="pt" type="datetime-local"><label>เลขอ้างอิงรายการ (ถ้ามี)</label><input id="pr" placeholder="เลขอ้างอิงในสลิป"><div class="err" id="perr"></div></div>';
  }
  document.getElementById("app").innerHTML=h;
  if(pay){var q=document.getElementById("qr");try{if(!p.payload)throw 0;var c=qrcode(0,"M");c.addData(p.payload);c.make();q.innerHTML=c.createImgTag(5,8)}catch(e){q.textContent="แสดง QR ไม่ได้ กรุณาติดต่อทีมงาน"}}
  bar('<button class="s" onclick="tab(2)">กลับ</button>'+(pay?'<button class="p" onclick="payNotify(\''+esc(id)+'\')">แจ้งโอนแล้ว</button>':''));
}
function payNotify(id){
  var t=document.getElementById("pt").value,e=document.getElementById("perr");
  if(!t){e.textContent="กรุณาระบุวัน-เวลาที่โอน";return}
  e.textContent="กำลังส่ง...";
  pf("POST","/pay/"+id+"/notify",{paidAt:t.replace("T"," "),ref:document.getElementById("pr").value.trim()}).then(function(){payOpen(id)}).catch(function(x){e.textContent=(x&&x.error)||"ส่งไม่สำเร็จ"});
}
// แอดมิน: ตั้งราคาสุดท้าย + ตรวจสอบการโอน
function payCtl(b){
  if(!API_URL||b.status==="ยกเลิก"||b.status==="ปฏิเสธ")return "";
  var st=b.payStatus==="ยืนยันแล้ว"?"✅ ชำระแล้ว "+baht(b.finalPrice):b.payStatus==="รอตรวจสอบ"?"⏳ รอตรวจสอบการโอน "+baht(b.finalPrice):b.finalPrice?"รอลูกค้าชำระ "+baht(b.finalPrice):"ยังไม่ตั้งราคาสุดท้าย";
  var h='<div class="who" style="margin-top:6px">💳 '+st+'</div>';
  if(b.payStatus==="ยืนยันแล้ว"||b.payStatus==="รอตรวจสอบ")return h;
  return h+'<div class="row" style="margin-top:6px"><input id="fp_'+esc(b.id)+'" type="number" inputmode="numeric" placeholder="ราคาสุดท้าย (บาท)" value="'+esc(b.finalPrice||b.price)+'"><button class="slot" onclick="setPrice(\''+esc(b.id)+'\')">ตั้งราคา + ขอชำระเงิน</button></div>';
}
function setPrice(id){
  var v=+document.getElementById("fp_"+id).value;if(!(v>0)){alert("กรุณาใส่ราคา");return}
  if(!confirm("ส่งคำขอชำระเงิน "+baht(v)+" ให้ลูกค้า?"))return;
  api("/bookings/"+id+"/price",{method:"POST",body:JSON.stringify({price:v})}).then(adminLoad).catch(function(){alert("ตั้งราคาไม่สำเร็จ (อาจมีการแจ้งโอนแล้ว)")});
}
function adminPays(){
  api("/payments/pending").then(function(L){
    document.getElementById("app").innerHTML='<div class="card"><h2>💳 รอตรวจสอบการโอน ('+L.length+')</h2><div class="who">เทียบยอดและเวลากับรายการเข้าบัญชีของบริษัทก่อนกดยืนยัน</div></div>'+(L.length?L.map(function(x){
      return '<div class="card"><div class="bk"><b>'+esc(x.name)+'</b><span class="tag">'+baht(x.amount)+'</span></div><div class="who" style="line-height:1.6">คิว '+esc(x.bookingId)+' · '+esc(x.from)+' → '+esc(x.to)+'<br>เวลาโอน '+esc(x.paidAt)+(x.ref?'<br>อ้างอิง '+esc(x.ref):'')+'</div><input id="pr_'+esc(x.id)+'" placeholder="เหตุผล (กรณีไม่ผ่าน)" style="margin-top:8px"><div class="row" style="margin-top:8px"><button class="slot" onclick="payRev(\''+esc(x.id)+'\',true)">✅ ยืนยันรับเงินแล้ว</button><button class="slot" onclick="payRev(\''+esc(x.id)+'\',false)">❌ ไม่ผ่าน</button></div></div>'}).join(""):'<div class="empty">ไม่มีรายการรอตรวจสอบ</div>');
    bar('<button class="s" onclick="adminLoad()">กลับ</button>');
  }).catch(function(){alert("โหลดไม่สำเร็จ")});
}
function payRev(id,ok){
  var r=document.getElementById("pr_"+id).value.trim();if(!ok&&!r){alert("กรุณาใส่เหตุผล");return}
  api("/payments/"+id+"/review",{method:"POST",body:JSON.stringify({ok:ok,reason:r})}).then(adminPays).catch(function(){alert("ไม่สำเร็จ (อาจถูกตรวจสอบไปแล้ว)")});
}
// ====== หน้าแอดมิน ======
var AK="",AF="ทั้งหมด",AL=[];
var STS=["ทั้งหมด","รอยืนยัน","ยืนยันแล้ว","กำลังขนส่ง","เสร็จสิ้น","ปฏิเสธ","ยกเลิก"];
var NEXT={"รอยืนยัน":["ยืนยันแล้ว","ปฏิเสธ"],"ยืนยันแล้ว":["กำลังขนส่ง"],"กำลังขนส่ง":["เสร็จสิ้น"]};
function api(p,o){o=o||{};o.headers={"Content-Type":"application/json","x-admin-pin":AK};return fetch(API_URL+p,o).then(function(r){if(!r.ok)throw 0;return r.json()})}
function login(){
  var p=document.getElementById("pin").value;AK=p;
  if(API_URL){api("/bookings").then(function(d){AL=d;renderAdmin()}).catch(function(){AK="";document.getElementById("aerr").textContent="PIN ไม่ถูกต้อง หรือเชื่อมต่อเซิร์ฟเวอร์ไม่ได้"})}
  else if(p===ADMIN_PIN){adminLoad()}else{AK="";document.getElementById("aerr").textContent="PIN ไม่ถูกต้อง"}
}
function adminLoad(){
  if(API_URL){api("/bookings").then(function(d){AL=d;renderAdmin()}).catch(function(){})}
  else{AL=load();renderAdmin()}
}
function setSt(id,st){
  if(API_URL){api("/bookings/"+id+"/status",{method:"POST",body:JSON.stringify({status:st})}).then(adminLoad).catch(function(){alert("อัปเดตไม่สำเร็จ")})}
  else{var l=load();l.forEach(function(b){if(b.id===id)b.status=st});save(l);adminLoad()}
}
function setAF(v){AF=v;renderAdmin()}
function logout(){AK="";renderAdmin()}
function renderAdmin(){
  var a=document.getElementById("app");
  if(!AK){
    a.innerHTML='<div class="card"><h2>เข้าสู่ระบบแอดมิน</h2><input id="pin" type="password" placeholder="PIN"><div class="err" id="aerr"></div></div>';
    bar('<button class="p" onclick="login()">เข้าสู่ระบบ</button>');return;
  }
  var cnt={};AL.forEach(function(b){cnt[b.status]=(cnt[b.status]||0)+1});
  var list=AL.filter(function(b){return AF==="ทั้งหมด"||b.status===AF}).sort(function(x,y){return (x.date+x.time)<(y.date+y.time)?-1:1});
  a.innerHTML='<div class="card"><h2>จัดการคิว ('+AL.length+' รายการ)</h2><div class="who" style="margin-bottom:8px">รอยืนยัน '+(cnt["รอยืนยัน"]||0)+' · กำลังขนส่ง '+(cnt["กำลังขนส่ง"]||0)+' · เสร็จสิ้น '+(cnt["เสร็จสิ้น"]||0)+'</div>'+
  '<select onchange="setAF(this.value)">'+STS.map(function(s){return '<option'+(s===AF?" selected":"")+'>'+s+'</option>'}).join("")+'</select></div>'+
  (list.length?list.map(function(b){
    return '<div class="card"><div class="bk"><b>'+esc(b.emoji+" "+b.vehicle)+'</b><span class="tag">'+esc(b.status)+'</span></div>'+
    '<div class="who" style="margin-top:6px;line-height:1.7">รหัส '+esc(b.id)+' · '+esc(fmtDate(b.date))+' '+esc(b.time)+' น.<br>👤 '+esc(b.name)+' · <a href="tel:'+esc(b.phone)+'">'+esc(b.phone)+'</a><br>'+esc(b.from)+' → '+esc(b.to)+'<br>'+esc(b.cargo)+' · '+esc(b.weight)+' กก. · '+esc(b.km)+' กม. · '+baht(b.price)+(b.note?'<br>📝 '+esc(b.note):'')+'</div>'+
    (NEXT[b.status]||[]).map(function(s){return '<button class="slot" style="width:auto;margin:8px 6px 0 0;padding:8px 14px" onclick="setSt(\''+esc(b.id)+'\',\''+s+'\')">'+s+'</button>'}).join("")+payCtl(b)+'</div>'}).join(""):'<div class="empty">ไม่มีรายการ</div>');
  bar('<button class="s" onclick="adminLoad()">รีเฟรช</button><button class="s" onclick="adminPays()">💳 ตรวจสอบการโอน</button><button class="s" onclick="logout()">ออกจากระบบ</button>');
}
if(location.hash==="#admin")document.getElementById("t3").style.display="";
render();
</script>
</body>
</html>
